# DocBen public documentation
# https://docben (public docs site)

title: DocBen Public Documentation
description: PhilHealth Claims API integration guide, client examples, and product privacy policies.

# Jekyll theme so Markdown pages (the integration guide, etc.) render as styled
# HTML instead of raw text. cayman is a clean docs-style theme.
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

markdown: GFM

# Apply the theme's default layout to all pages, including Markdown files that
# have no front matter (Jekyll normally requires front matter to render .md).
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Don't process the .ai-coding index artifacts (also gitignored).
exclude:
  - .ai-coding
  - "**/.ai-coding/**"
